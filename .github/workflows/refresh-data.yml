name: Refresh NBA data

on:
  schedule:
    - cron: "17 15 * * *"   # every day at 15:17 UTC (10:17am EST / 11:17am EDT), after last night's games
  workflow_dispatch:         # adds a "Run workflow" button in the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Fetch current season into Supabase
        run: python pipeline/seed.py --seasons 1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
