name: Refresh NBA data

# Schedule is OFF: stats.nba.com blocks GitHub's servers (ReadTimeout), so for now
# run `python pipeline/seed.py` from your own machine. Re-enable if the data source changes.
on:
  # schedule:
  #   - cron: "17 15 * * *"   # daily at 15:17 UTC (10:17am EST), after last night's games
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Fetch current season into Supabase
        run: python pipeline/seed.py --seasons 1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
